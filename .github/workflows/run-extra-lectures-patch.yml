name: Extra lectures patch runner
on:
  push:
    branches:
      - feature/extra-lectures-impl
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/extra-lectures-impl
          fetch-depth: 0
      - name: Apply and verify
        run: |
          set -euo pipefail
          python3 scripts/apply_extra_lectures.py
          npm ci --no-audit --no-fund
          node test-engine.mjs
          node test-extra-lectures.mjs
          npm run build
      - name: Commit feature
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply_extra_lectures.py .github/workflows/run-extra-lectures-patch.yml
          git add src test-extra-lectures.mjs .github/workflows/ui-quality.yml scripts/apply_extra_lectures.py .github/workflows/run-extra-lectures-patch.yml
          git commit -m "feat: add per-chapter extra lectures"
          git push origin HEAD:feature/extra-lectures-impl

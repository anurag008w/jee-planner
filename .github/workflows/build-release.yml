name: Build + APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (premium bundle + PWA)
        run: npm run build

      - name: Smoke test — built bundle + manifest + sw
        run: |
          [ -f dist/index.html ] || { echo "✘ no dist/index.html"; exit 1; }
          [ -f dist/manifest.webmanifest ] || { echo "✘ no manifest"; exit 1; }
          [ -f dist/sw.js ] || { echo "✘ no service worker"; exit 1; }
          grep -q 'id="root"' dist/index.html && echo "✔ root id"
          grep -q 'manifest.webmanifest' dist/index.html && echo "✔ manifest linked"
          node -e "JSON.parse(require('node:fs').readFileSync('dist/manifest.webmanifest','utf8'))" && echo "✔ manifest valid JSON"
          echo "SMOKE OK"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: jee-planner-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags chahiye taaki versionCode tag se bane (v1.3.1 → 10301)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor (embed fresh bundle into Android project)
        run: npx cap sync android

      - name: Decode signing keystore (permanent key → in-place updates)
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/jee-planner.keystore
          ls -la android/app/jee-planner.keystore
          keytool -list -keystore android/app/jee-planner.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" 2>&1 | head -3

      - name: Build signed APK (stable signature — updates merge in-place)
        working-directory: android
        env:
          KEYSTORE_PATH: jee-planner.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew assembleRelease

      - name: Verify APK is SIGNED (unsigned = install fail, gate it here)
        working-directory: android
        run: |
          ls -la app/build/outputs/apk/release/
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | head -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jee-planner-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release (when a tag is pushed)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
name: Build + APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create (vMAJOR.MINOR.PATCH)'
        required: true
        default: 'v1.5.2'
        type: string

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', inputs.release_tag) || format('build-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release tag: $RELEASE_TAG (use vMAJOR.MINOR.PATCH)"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG"
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync package metadata to release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.RELEASE_VERSION;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const actual = {
            package: pkg.version,
            lock: lock.version,
            root: lock.packages?.['']?.version,
          };
          if (actual.package !== expected || actual.lock !== expected || actual.root !== expected) {
            console.error({ expected, actual });
            process.exit(1);
          }
          console.log(`Package metadata verified: ${expected}`);
          NODE

      - name: Commit release version metadata
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No package metadata changes needed."
            COMMIT="$(git rev-parse HEAD)"
          else
            git commit -m "chore(release): sync package metadata to ${RELEASE_VERSION} [skip ci]"
            git push origin HEAD:main
            COMMIT="$(git rev-parse HEAD)"
          fi
          git tag "$RELEASE_TAG" "$COMMIT"
          git push origin "$RELEASE_TAG"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Released $RELEASE_TAG from commit $COMMIT"

  build:
    needs: [prepare]
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit || github.sha }}

      - name: Resolve app version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${RELEASE_VERSION}"
          else
            VERSION="dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building JEE Planner version: $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify package metadata version
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.EXPECTED_VERSION;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const actual = {
            package: pkg.version,
            lock: lock.version,
            root: lock.packages?.['']?.version,
          };
          if (expected !== 'dev' && (actual.package !== expected || actual.lock !== expected || actual.root !== expected)) {
            console.error({ expected, actual });
            process.exit(1);
          }
          console.log('Package metadata verified:', actual);
          NODE

      - name: Scheduler engine tests
        run: node test-engine.mjs

      - name: Build (premium bundle + PWA)
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      - name: Smoke test — built bundle + manifest + splash
        run: |
          set -e
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          grep -q 'id="root"' dist/index.html
          grep -q 'manifest.webmanifest' dist/index.html
          grep -q 'JEE Planner' dist/index.html
          node -e "JSON.parse(require('node:fs').readFileSync('dist/manifest.webmanifest','utf8'))"
          echo 'SMOKE OK'

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: jee-planner-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  apk:
    needs: [prepare, build]
    if: always() && needs.build.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.commit || github.sha }}

      - name: Resolve app version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION_NAME="$RELEASE_TAG"
          else
            VERSION_NAME="dev"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building Android versionName: $VERSION_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21 (Android Gradle)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deps
        run: npm ci

      - name: Verify package metadata version
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version || 'dev' }}
        run: |
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.EXPECTED_VERSION;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const actual = {
            package: pkg.version,
            lock: lock.version,
            root: lock.packages?.['']?.version,
          };
          if (expected !== 'dev' && (actual.package !== expected || actual.lock !== expected || actual.root !== expected)) {
            console.error({ expected, actual });
            process.exit(1);
          }
          console.log('Package metadata verified:', actual);
          NODE

      - name: Build web bundle
        env:
          VITE_APP_VERSION: ${{ needs.prepare.outputs.version || 'dev' }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/jee-planner.keystore
          test -s android/app/jee-planner.keystore
          keytool -list -keystore android/app/jee-planner.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" 2>&1 | head -3

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: jee-planner.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: ./gradlew clean assembleRelease

      - name: Verify signed APK
        working-directory: android
        run: |
          set -e
          APK='app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Name release APK
        working-directory: android
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'dev' }}
        run: |
          set -e
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/named/JEE-Planner-${RELEASE_TAG}.apk"
          test -f "app/build/outputs/apk/release/named/JEE-Planner-${RELEASE_TAG}.apk"

      - name: Upload named APK
        uses: actions/upload-artifact@v4
        with:
          name: jee-planner-apk
          path: android/app/build/outputs/apk/release/named/JEE-Planner-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach named APK to Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: JEE Planner ${{ inputs.release_tag }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/named/JEE-Planner-*.apk

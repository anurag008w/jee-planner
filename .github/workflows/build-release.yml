name: Build + APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create (example: v1.3.5)'
        required: true
        default: 'v1.3.5'
        type: string

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Scheduler engine tests
        run: node test-engine.mjs

      - name: Build (premium bundle + PWA)
        run: npm run build

      - name: Smoke test — built bundle + manifest + splash
        run: |
          set -e
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          grep -q 'id="root"' dist/index.html
          grep -q 'manifest.webmanifest' dist/index.html
          grep -q 'JEE Planner' dist/index.html
          node -e "JSON.parse(require('node:fs').readFileSync('dist/manifest.webmanifest','utf8'))"
          echo 'SMOKE OK'

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: jee-planner-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag (manual run only)
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -e
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid release tag: $RELEASE_TAG (use vMAJOR.MINOR.PATCH)"; exit 1 ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists: $RELEASE_TAG"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "$RELEASE_TAG"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/jee-planner.keystore
          test -s android/app/jee-planner.keystore
          keytool -list -keystore android/app/jee-planner.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" 2>&1 | head -3

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: jee-planner.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: ./gradlew clean assembleRelease

      - name: Verify signed APK
        working-directory: android
        run: |
          set -e
          APK='app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Name release APK
        working-directory: android
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -e
          mkdir -p app/build/outputs/apk/release/named
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/named/JEE-Planner-${RELEASE_TAG}.apk"
          test -f "app/build/outputs/apk/release/named/JEE-Planner-${RELEASE_TAG}.apk"

      - name: Upload named APK
        uses: actions/upload-artifact@v4
        with:
          name: jee-planner-apk
          path: android/app/build/outputs/apk/release/named/JEE-Planner-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach named APK to Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: JEE Planner ${{ inputs.release_tag }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/named/JEE-Planner-*.apk

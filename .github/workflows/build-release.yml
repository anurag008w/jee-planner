name: Build + Release (JEE Planner — in-place updates)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (premium bundle + PWA)
        run: npm run build

      - name: Smoke test — built bundle + manifest + sw
        run: |
          [ -f dist/index.html ] || { echo "✘ no dist/index.html"; exit 1; }
          [ -f dist/manifest.webmanifest ] || { echo "✘ no manifest"; exit 1; }
          [ -f dist/sw.js ] || { echo "✘ no service worker"; exit 1; }
          grep -q 'id="root"' dist/index.html && echo "✔ root id"
          grep -q 'manifest.webmanifest' dist/index.html && echo "✔ manifest linked"
          node -e "JSON.parse(require('node:fs').readFileSync('dist/manifest.webmanifest','utf8'))" && echo "✔ manifest valid JSON"
          echo "SMOKE OK"

      - name: Upload build artifact (for Pages / manual APK)
        uses: actions/upload-artifact@v4
        with:
          name: jee-planner-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Deploy to GitHub Pages (installable PWA — auto-updates, no reinstall)
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
